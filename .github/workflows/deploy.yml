name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # This is a user site (<user>.github.io), served from /, so no base URL.
      # For a project site set EXPO_BASE_URL to /<repo-name>.
      - name: Export web build
        run: npx expo export --platform web --output-dir ../../dist
        working-directory: apps/mobile
        env:
          EXPO_BASE_URL: ''

      # expo-router is a single-page app: serve index.html for unknown routes
      # so deep links (e.g. /profile/42) resolve instead of 404ing. .nojekyll
      # stops Pages from dropping the underscore-prefixed _expo directory.
      - name: Prepare for Pages
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
